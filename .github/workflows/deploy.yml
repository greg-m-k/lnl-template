# Optional deploy from GitHub Actions, for teams that cannot use Cloudflare Workers Builds.
# Off by default so it never deploys twice. To use it:
#   1. Settings > Secrets and variables > Actions > Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#      (token template "Edit Cloudflare Workers").
#   2. Settings > Secrets and variables > Actions > Variables: DEPLOY_WITH_ACTIONS = true
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    if: vars.DEPLOY_WITH_ACTIONS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm and Node versions from package.json's devEngines, then pnpm install --frozen-lockfile.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
