# Checks pushes to main and every pull request with one `pnpm run test`: unit checks, the real site served
# locally by Alchemy's test harness, and the site frame in Chrome (Vitest browser mode).
# Deploys nothing and needs no secrets.
# Deploying is done by Cloudflare Workers Builds (see README), or by deploy.yml if you opt in.
name: ci
# A branch with an open pull request runs once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:
# The GITHUB_TOKEN can read the repository and nothing else.
permissions:
  contents: read
# A new push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      DO_NOT_TRACK: "1" # Alchemy's CLI sends usage telemetry unless this is set
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm and Node versions from package.json's devEngines, then pnpm install --frozen-lockfile.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run test
